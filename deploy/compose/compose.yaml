name: novelstudio

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: novelstudio
      MYSQL_USER: novelstudio
      MYSQL_PASSWORD: novelstudio
      MYSQL_ROOT_PASSWORD: local-root-only
      TZ: UTC
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    ports: ["127.0.0.1:3306:3306"]
    volumes: ["mysql-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-unovelstudio", "-pnovelstudio", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    ports: ["127.0.0.1:6379:6379"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: novelstudio
      RABBITMQ_DEFAULT_PASS: novelstudio
    ports: ["127.0.0.1:5672:5672", "127.0.0.1:15672:15672"]
    volumes: ["rabbitmq-data:/var/lib/rabbitmq"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

# Configure your own external MinIO through MINIO_* variables.

volumes:
  mysql-data:
  rabbitmq-data:
